<canvas id="bg-animation" aria-hidden="true" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none;"></canvas>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('bg-animation');
    const ctx = canvas.getContext('2d');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    let particles = [];
    let frameId = null;
    let resizeTimer = null;

    // (Re)build the particle list to fit the current window
    function init() {
      // Draw at the screen's pixel density so dots stay crisp on high-DPI displays
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Fewer particles on small screens
      const particleCount = window.innerWidth < 768 ? 40 : 80;

      particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          radius: Math.random() * 2 + 1,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.fillStyle = 'rgba(150, 150, 150, 0.3)';

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function step() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      // Move each particle, wrapping around the screen edges
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;
      });

      draw();
      frameId = requestAnimationFrame(step);
    }

    function start() {
      // Users who ask for reduced motion get a static field of dots instead
      if (frameId !== null || reducedMotion.matches || document.hidden) return;
      frameId = requestAnimationFrame(step);
    }

    function stop() {
      if (frameId === null) return;
      cancelAnimationFrame(frameId);
      frameId = null;
    }

    // Fully stop the loop while the tab is hidden, resume when it comes back
    document.addEventListener('visibilitychange', () => {
      document.hidden ? stop() : start();
    });

    // React if the user toggles reduced motion while the page is open
    reducedMotion.addEventListener('change', () => {
      reducedMotion.matches ? stop() : start();
    });

    // Wait for resizing to settle before rebuilding the particles
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        init();
        draw();
      }, 150);
    });

    init();
    draw();
    start();
  });
</script>
